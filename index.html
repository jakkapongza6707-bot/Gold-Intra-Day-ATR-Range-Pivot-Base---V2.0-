<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Zone Analyzer</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f4f9; color: #333; }
    .card { max-width: 450px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    h2, h3 { text-align: center; margin-top: 0; color: #1a202c; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #2b6cb0; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    button:hover { background: #2c5282; }

    /* Zone Result Styling */
    #resultContainer { margin-top: 25px; display: none; }
    .status-badge { text-align: center; padding: 8px; border-radius: 6px; background: #edf2f7; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
    .zone-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .zone-table th, .zone-table td { padding: 10px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    .zone-table th { background: #f7fafc; color: #4a5568; }
    .type-resistance { color: #e53e3e; font-weight: bold; }
    .type-support { color: #38a169; font-weight: bold; }
    .badge-strong { background: #c6f6d5; color: #22543d; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-moderate { background: #feebc8; color: #744210; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-weak { background: #fed7d7; color: #742a2a; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Gold Zone Analyzer</h2>
    
    <div class="form-group">
      <label for="currentPrice">Current Price (ราคาปัจจุบัน):</label>
      <input type="number" id="currentPrice" placeholder="เช่น 2650" step="any">
    </div>

    <div class="form-group">
      <label for="ma12">MA12:</label>
      <input type="number" id="ma12" placeholder="เช่น 2640" step="any">
    </div>

    <div class="form-group">
      <label for="atr14">ATR14:</label>
      <input type="number" id="atr14" placeholder="เช่น 25" step="any">
    </div>

    <div class="form-group">
      <label for="sd20">SD20:</label>
      <input type="number" id="sd20" placeholder="เช่น 30" step="any">
    </div>

    <button id="btnAnalyzeMarket">วิเคราะห์และบันทึกข้อมูล</button>

    <!-- กล่องแสดงผลลัพธ์ -->
    <div id="resultContainer">
      <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">
      <h3>ผลการวิเคราะห์โซน</h3>
      <div id="statusRegime" class="status-badge"></div>

      <table class="zone-table">
        <thead>
          <tr>
            <th>ชื่อโซน</th>
            <th>ราคา</th>
            <th>ความแข็งแกร่ง</th>
          </tr>
        </thead>
        <tbody id="zonesTableBody">
          <!-- ข้อมูลจะถูกฉีดเข้าตรงนี้ด้วย JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js?v=4"></script>
</body>
</html>
