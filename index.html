<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Zone Analyzer</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
    .card { max-width: 400px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Gold Zone Analyzer</h2>
    
    <div class="form-group">
      <label for="currentPrice">Current Price:</label>
      <input type="number" id="currentPrice" placeholder="เช่น 2650" step="any">
    </div>

    <div class="form-group">
      <label for="ma12">MA12:</label>
      <input type="number" id="ma12" placeholder="เช่น 2640" step="any">
    </div>

    <div class="form-group">
      <label for="atr14">ATR14:</label>
      <input type="number" id="atr14" placeholder="เช่น 25" step="any">
    </div>

    <div class="form-group">
      <label for="sd20">SD20:</label>
      <input type="number" id="sd20" placeholder="เช่น 30" step="any">
    </div>

    <button id="btnAnalyzeMarket">วิเคราะห์และบันทึกข้อมูล</button>
  </div>

  <!-- บังคับโหลดไฟล์ script.js เวอร์ชั่นใหม่ -->
  <script src="script.js?v=2"></script>
</body>
</html>
